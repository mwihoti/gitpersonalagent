name: Telegram Scan

# Triggered by the Telegram webhook (api/telegram.js) via repository_dispatch.
# Runs the same scan as the daily cron, but with a 6-hour budget instead of a
# serverless function's seconds — this is what makes /scan work on Vercel.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BITCOINDEVS_ISSUES_URL: https://bitcoindevs.xyz/good-first-issues?sort=newest-first&page=1&labels=good+first+issue
  BITCOINDEVS_MAX_REPOS: 12
  BITCOINDEVS_DISCOVERY: true

on:
  repository_dispatch:
    types: [telegram-scan]
  workflow_dispatch:
    inputs:
      scan_mode:
        description: 'Scan mode: default, all, goodfirst, medium'
        required: false
        default: 'default'
      chat_id:
        description: 'Telegram chat to notify if the scan fails (optional)'
        required: false
        default: ''
      bot_id:
        description: 'Bot the scan was requested on, so the digest answers there (optional)'
        required: false
        default: ''

concurrency:
  # One scan at a time across every workflow: parallel scans fight over the
  # same model rate limit and both save the same "new" items.
  group: repo-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: danpersonaagent   # reads secrets from the danpersonaagent environment

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run scan
        run: node agent.js --scan
        env:
          SCAN_MODE: ${{ github.event.client_payload.scan_mode || inputs.scan_mode || 'default' }}
          # A plain /scan reports what changed (and says so when nothing did).
          # The explicit modes (/scan all|goodfirst|medium) show everything again.
          SCAN_DEDUPE: ${{ (github.event.client_payload.scan_mode || inputs.scan_mode || 'default') == 'default' && 'true' || 'false' }}
          SCAN_REPLY_BOT: ${{ github.event.client_payload.bot_id || inputs.bot_id || '' }}
          SCAN_TRIGGER: telegram-actions
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}          # xAI Grok (optional)
          FALLBACK_API_KEY: ${{ secrets.FALLBACK_API_KEY }}  # any OpenAI-compatible endpoint (optional)
          FALLBACK_API_URL: ${{ vars.FALLBACK_API_URL }}
          FALLBACK_MODELS: ${{ vars.FALLBACK_MODELS }}
          MODEL_PROVIDERS: ${{ vars.MODEL_PROVIDERS }}       # order, e.g. groq,xai,gemini
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          GROQ_MODELS: ${{ vars.GROQ_MODELS }}
          GROQ_TPM: ${{ vars.GROQ_TPM }}  # optional; unset = read from the API
          XAI_MODELS: ${{ vars.XAI_MODELS }}
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME }}
          AIRTABLE_SUBSCRIBERS_TABLE: ${{ secrets.AIRTABLE_SUBSCRIBERS_TABLE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN_2: ${{ secrets.TELEGRAM_BOT_TOKEN_2 }}  # second bot (optional)
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          GITHUB_REPOS: ${{ secrets.STACKS_REPOS }}

      - name: Tell the requester the scan failed
        if: failure() && (github.event.client_payload.chat_id || inputs.chat_id) != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ github.event.client_payload.chat_id || inputs.chat_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H 'Content-Type: application/json' \
            --data "$(jq -n --arg chat "$CHAT_ID" --arg url "$RUN_URL" \
              '{chat_id: $chat, text: ("Scan failed. Details: " + $url)}')"
