name: Daily Stacks Scan

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BITCOINDEVS_ISSUES_URL: https://bitcoindevs.xyz/good-first-issues?sort=newest-first&page=1&labels=good+first+issue
  BITCOINDEVS_MAX_REPOS: 12
  BITCOINDEVS_DISCOVERY: true

on:
  schedule:
    - cron: '0 5 * * *'   # 8am Nairobi time (EAT = UTC+3)
  workflow_dispatch:        # manual "Run workflow" button in GitHub UI

concurrency:
  # One scan at a time across every workflow: parallel scans fight over the
  # same model rate limit and both save the same "new" items.
  group: repo-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: danpersonaagent   # reads secrets from the danpersonaagent environment

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run scan
        run: node agent.js --scan
        env:
          # Repository variables (Settings → Variables) tune the daily digest
          # without editing this file: default | all | goodfirst | medium.
          SCAN_MODE: ${{ vars.DAILY_SCAN_MODE || 'default' }}
          DIGEST_MAX_PER_REPO: ${{ vars.DIGEST_MAX_PER_REPO || '2' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # auto-provided by Actions
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}  # free at aistudio.google.com
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}      # fallback when all Gemini models are unavailable
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}          # xAI Grok (optional)
          FALLBACK_API_KEY: ${{ secrets.FALLBACK_API_KEY }}  # any OpenAI-compatible endpoint (optional)
          FALLBACK_API_URL: ${{ vars.FALLBACK_API_URL }}
          FALLBACK_MODELS: ${{ vars.FALLBACK_MODELS }}
          MODEL_PROVIDERS: ${{ vars.MODEL_PROVIDERS }}       # order, e.g. groq,xai,gemini
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          GROQ_MODELS: ${{ vars.GROQ_MODELS }}
          XAI_MODELS: ${{ vars.XAI_MODELS }}
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME }}
          AIRTABLE_SUBSCRIBERS_TABLE: ${{ secrets.AIRTABLE_SUBSCRIBERS_TABLE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN_2: ${{ secrets.TELEGRAM_BOT_TOKEN_2 }}  # second bot (optional)
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          GITHUB_REPOS: ${{ secrets.STACKS_REPOS }}
